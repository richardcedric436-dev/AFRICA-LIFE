<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFRICA LIFE — Prototype V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a1b;color:#f7f2e8;font:15px Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;padding:16px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.panel{background:#101a1be8;border:1px solid #ffffff24;border-radius:14px;padding:12px 15px;box-shadow:0 10px 30px #0005}.brand b{letter-spacing:2px;font-size:19px}.brand small{display:block;color:#aebbb5;font-size:10px;letter-spacing:2px;margin-top:4px}.stats{display:flex;gap:18px;font-size:11px;color:#b8c4be}.stats b{display:block;color:#f2bd58;font-size:16px;margin-top:4px}.mission{margin-top:12px;max-width:330px}.tag{font-size:10px;color:#f2bd58;font-weight:bold;letter-spacing:2px}.mission h3{margin:8px 0}.mission p{font-size:12px;color:#d0d8d1;line-height:1.5;margin:0}.bottom{align-items:end}.hint{font-size:12px;color:#d4ddd7}.key{background:#29383a;padding:5px 8px;border-radius:5px;margin:0 2px}.btn{pointer-events:auto;background:#f2bd58;color:#17201e;border:0;border-radius:10px;padding:13px 18px;font-weight:bold;cursor:pointer}.toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#111d1deb;border:1px solid #ffffff30;padding:13px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}#mobile{display:none;position:fixed;bottom:15px;left:15px;right:15px;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,45px);gap:4px;pointer-events:auto}.pad button,.mobact{height:44px;background:#132020dd;color:white;border:1px solid #ffffff55;border-radius:10px;font-weight:bold;touch-action:none}.pad button:first-child{grid-column:2}.mobact{pointer-events:auto;background:#f2bd58;color:#18201e;padding:0 15px}@media(max-width:650px){.hud{padding:9px}.brand b{font-size:14px}.stats{gap:8px;padding:9px;font-size:9px}.stats b{font-size:13px}.mission{max-width:235px;padding:10px}.mission h3{font-size:14px}.mission p{font-size:11px}.hint{display:none}#mobile{display:flex}.bottom{justify-content:flex-end}}
</style>
<canvas id="c"></canvas><div class="hud"><div><div class="top"><div class="panel brand"><b>AFRICA LIFE</b><small>ABIDJAN • PROTOTYPE V1</small></div><div class="panel stats"><div>PORTEFEUILLE<b id="cash">0 FCFA</b></div><div>JOUR<b>01 • MATIN</b></div><div>RÉPUTATION<b id="rep">0</b></div></div></div><div class="panel mission"><div class="tag">MISSION PRINCIPALE</div><h3 id="mt">Un nouveau départ</h3><p id="md">Trouve Koffi près du petit maquis. Il pourra peut-être t'aider à trouver un premier travail.</p></div></div><div class="bottom"><div class="panel hint"><span class="key">Z Q S D</span> ou flèches pour bouger · <span class="key">E</span> interagir</div><button class="btn" id="act">INTERAGIR [E]</button></div></div><div class="toast" id="toast"></div><div id="mobile"><div class="pad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><button class="mobact" id="mact">INTERAGIR</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=1;function size(){D=devicePixelRatio||1;W=c.width=innerWidth*D;H=c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(D,0,0,D,0,0)}onresize=size;size();
const world={w:1600,h:1200},p={x:500,y:600,s:2.8},npc={x:690,y:600},keys={},touch={};let cash=0,rep=0,stage=0,timer;
const roads=[{x:0,y:460,w:1600,h:145},{x:740,y:0,w:145,h:1200},{x:0,y:800,w:1600,h:95}];
const buildings=[{x:90,y:90,w:220,h:170,c:'#c18b60',n:'HABITATIONS'},{x:410,y:80,w:220,h:180,c:'#a96650',n:'ATELIERS'},{x:990,y:100,w:300,h:170,c:'#c6a46e',n:'COMMERCES'},{x:120,y:930,w:260,h:190,c:'#bd8056',n:'MAISONS'},{x:620,y:990,w:250,h:150,c:'#d0a06b',n:'MARCHÉ'},{x:1100,y:930,w:300,h:190,c:'#ae7658',n:'MAQUIS'}];
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function worldDraw(){rect(0,0,1600,1200,'#567b59');for(let y=0;y<1200;y+=80)for(let a=0;a<1600;a+=90)rect(a,y,86,76,(a+y)%3?'#587e5b':'#527655');
roads.forEach(r=>{rect(r.x,r.y,r.w,r.h,'#444a49');x.fillStyle='#d6c68c';x.setLineDash([23,25]);x.lineWidth=3;x.beginPath();if(r.h<r.w){x.moveTo(0,r.y+r.h/2);x.lineTo(1600,r.y+r.h/2)}else{x.moveTo(r.x+r.w/2,0);x.lineTo(r.x+r.w/2,1200)}x.stroke();x.setLineDash([])});
for(let i=0;i<30;i++){let a=(i*181+60)%1600,b=(i*233+40)%1200;if(roads.some(r=>a>r.x-22&&a<r.x+r.w+22&&b>r.y-22&&b<r.y+r.h+22))continue;x.fillStyle='#31563e';x.beginPath();x.arc(a+3,b+4,17,0,7);x.fill();x.fillStyle='#79a15e';x.beginPath();x.arc(a,b,15,0,7);x.fill()}
buildings.forEach(o=>{rect(o.x+8,o.y+9,o.w,o.h,'#0003');rect(o.x,o.y,o.w,o.h,o.c);rect(o.x+8,o.y+8,o.w-16,10,'#ead5a8');for(let a=o.x+20;a<o.x+o.w-15;a+=43){rect(a,o.y+35,23,29,'#354c50');rect(a,o.y+78,23,29,'#354c50')}rect(o.x+o.w/2-17,o.y+o.h-38,34,38,'#44352b');x.fillStyle='white';x.font='bold 10px Arial';x.fillText(o.n,o.x+8,o.y+o.h+14)});
for(let i=0;i<5;i++){rect(635+i*45,1060,34,27,['#c64e42','#e2b84f','#438c7d'][i%3]);rect(635+i*45,1060,34,6,'#f1d9ad')}
}
function person(a,b,col,player=false){x.fillStyle='#0005';x.beginPath();x.ellipse(a,b+12,12,5,0,0,7);x.fill();x.fillStyle=col;x.beginPath();x.arc(a,b,11,0,7);x.fill();x.fillStyle='#e9bd98';x.beginPath();x.arc(a,b-8,7,0,7);x.fill();if(player){x.strokeStyle='#f2bd58';x.lineWidth=3;x.beginPath();x.arc(a,b,16,0,7);x.stroke()}}
function render(){x.clearRect(0,0,innerWidth,innerHeight);let cx=Math.max(0,Math.min(1600-innerWidth,p.x-innerWidth/2)),cy=Math.max(0,Math.min(1200-innerHeight,p.y-innerHeight/2));x.save();x.translate(-cx,-cy);worldDraw();x.fillStyle='#f2bd58';x.beginPath();x.arc(npc.x,npc.y-27,13,0,7);x.fill();x.fillStyle='#17201e';x.font='bold 13px Arial';x.fillText('!',npc.x-4,npc.y-22);person(npc.x,npc.y,'#c98148');x.fillStyle='white';x.font='bold 12px Arial';x.fillText('KOFFI',npc.x-19,npc.y+30);person(p.x,p.y,'#267c9b',true);if(Math.hypot(p.x-npc.x,p.y-npc.y)<75){x.strokeStyle='#f2bd58';x.setLineDash([5,5]);x.beginPath();x.arc(npc.x,npc.y,42,0,7);x.stroke();x.setLineDash([])}x.restore();
let mx=innerWidth-145,my=100;x.fillStyle='#101a1bdd';x.fillRect(mx-7,my-7,137,106);x.fillStyle='#64845f';x.fillRect(mx,my,123,92);x.fillStyle='#454b49';x.fillRect(mx,my+39,123,12);x.fillRect(mx+55,my,12,92);x.fillStyle='#f2bd58';x.beginPath();x.arc(mx+p.x/1600*123,my+p.y/1200*92,4,0,7);x.fill();x.fillStyle='white';x.font='9px Arial';x.fillText('ABIDJAN • ZONE 01',mx,my-13);requestAnimationFrame(render)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),2600)}
function ui(){document.getElementById('cash').textContent=cash.toLocaleString('fr-FR')+' FCFA';document.getElementById('rep').textContent=rep;document.getElementById('mt').textContent=stage===0?'Un nouveau départ':stage===1?'Premier petit boulot':'Une première réussite';document.getElementById('md').textContent=stage===0?'Trouve Koffi près du petit maquis. Il pourra peut-être t’aider à trouver un premier travail.':stage===1?'Koffi t’a confié une course : apporte ce colis au marché, près des étals colorés.':'Mission accomplie ! Tu as gagné tes premiers francs. Explore la ville et prépare la suite.'}
function interact(){let d=Math.hypot(p.x-npc.x,p.y-npc.y);if(stage===0){if(d>75){toast('Approche-toi de Koffi, près du maquis.');return}stage=1;toast('Koffi : « Va livrer ce colis au marché ! »')}else if(stage===1){if(Math.hypot(p.x-750,p.y-1080)>110){toast('Va au marché, près des étals colorés.');return}stage=2;cash+=5000;rep++;toast('Mission réussie ! +5 000 FCFA • Réputation +1')}else toast('Koffi : « Continue comme ça, Abidjan est à toi ! »');ui()}
function move(){let dx=0,dy=0;if(keys.ArrowUp||keys.z||keys.Z||touch.up)dy--;if(keys.ArrowDown||keys.s||keys.S||touch.down)dy++;if(keys.ArrowLeft||keys.q||keys.Q||touch.left)dx--;if(keys.ArrowRight||keys.d||keys.D||touch.right)dx++;if(dx&&dy){dx*=.707;dy*=.707}p.x=Math.max(20,Math.min(1580,p.x+dx*p.s));p.y=Math.max(20,Math.min(1180,p.y+dy*p.s));requestAnimationFrame(move)}move();render();ui();
onkeydown=e=>{keys[e.key]=true;if(e.key.toLowerCase()==='e')interact()};onkeyup=e=>keys[e.key]=false;document.getElementById('act').onclick=interact;document.getElementById('mact').onclick=interact;document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d;b.onpointerdown=e=>{e.preventDefault();touch[d]=true};['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,e=>{e.preventDefault();touch[d]=false}))});
</script></html>
